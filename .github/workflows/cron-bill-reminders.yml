name: Bill reminders

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake API
        run: curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 60 "${{ secrets.API_URL }}/health"
      - name: Send reminders
        run: |
          curl -fsS -X POST "${{ secrets.API_URL }}/internal/cron/bill-reminders" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" --max-time 120
