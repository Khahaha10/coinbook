name: Demo cleanup

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake API
        run: curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 60 "${{ secrets.API_URL }}/health"
      - name: Delete expired demo accounts
        run: |
          curl -fsS -X POST "${{ secrets.API_URL }}/internal/cron/demo-cleanup" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" --max-time 120
